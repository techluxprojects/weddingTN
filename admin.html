<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSVP Admin</title>
    <style>
      :root {
        --bg: #140d09;
        --panel: #1d130f;
        --gold: #d7b56d;
        --gold-soft: #f1dca5;
        --text: #f8f4ef;
        --muted: #c9bca4;
        --danger: #d55d5d;
        --success: #4ea66a;
        --border: rgba(215, 181, 109, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, #0e0908 0%, #1e140f 100%);
        color: var(--text);
      }

      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px 18px 50px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
      }

      .topbar h1 {
        margin: 0;
        font-size: clamp(1.8rem, 5vw, 2.8rem);
        color: var(--gold-soft);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .button {
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button.primary {
        background: linear-gradient(135deg, #b88a3c, #d3a859);
        color: #261a10;
        border-color: transparent;
        font-weight: 700;
      }

      .button.danger {
        background: rgba(213, 93, 93, 0.12);
        border-color: rgba(213, 93, 93, 0.5);
        color: #ffd4d4;
      }

      .panel {
        background: rgba(29, 19, 15, 0.88);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
        overflow: hidden;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 14px 12px;
        text-align: left;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      th {
        background: rgba(255, 255, 255, 0.03);
        color: var(--gold-soft);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 0.74rem;
      }

      td input,
      td select {
        width: 100%;
        border: 1px solid rgba(215, 181, 109, 0.35);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        border-radius: 8px;
        padding: 9px 10px;
      }

      .status-pill {
        display: inline-block;
        min-width: 116px;
        text-align: center;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.8rem;
        letter-spacing: 0.02em;
      }

      .status-attending {
        background: rgba(78, 166, 106, 0.16);
        color: #d6f7df;
      }
      .status-pending {
        background: rgba(255, 255, 255, 0.06);
        color: var(--muted);
      }
      .status-not {
        background: rgba(213, 93, 93, 0.12);
        color: #ffd4d4;
      }

      .small-note {
        color: var(--muted);
        margin: 18px 0 0;
      }

      .empty {
        padding: 30px 20px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 700px) {
        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <h1>RSVP Admin</h1>
        <div class="actions">
          <button id="loadBtn" class="button" type="button">
            Reload db.json
          </button>
          <button id="addBtn" class="button primary" type="button">
            Add guest
          </button>
          <button id="downloadBtn" class="button" type="button">
            Download JSON
          </button>
        </div>
      </div>

      <div class="panel">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Status</th>
                <th>Function</th>
                <th>Delete</th>
              </tr>
            </thead>
            <tbody id="guestTableBody"></tbody>
          </table>
        </div>
      </div>

      <p class="small-note">
        Edit the guest list, then download the JSON file and replace the
        existing db.json content on your project root.
      </p>
    </div>

    <script>
      const defaultDb = {
        event: {
          bride: "Thilini Kaushalya",
          groom: "Nimash Karunathilake",
          date: "2026-10-21",
          startTime: "10:30",
          endTime: "16:00",
          venue: "Resheen Hotel and Banquets",
          address: "Kurunegala Road, Kotadeniyawa, Divulapitiya, Sri Lanka",
        },
        invites: [
          {
            id: "INV001",
            name: "Kevin",
            attendance: "Coming",
            function: "Wedding Day",
          },
          {
            id: "INV002",
            name: "Nimali",
            attendance: "Not Coming",
            function: "Wedding Day",
          },
        ],
      };

      let guestData = { ...defaultDb, invites: [...defaultDb.invites] };
      const guestTableBody = document.getElementById("guestTableBody");

      function normalizeAttendance(value) {
        const raw = String(value ?? "")
          .trim()
          .toLowerCase()
          .replace(/[^a-z]/g, "");

        if (
          [
            "attending",
            "coming",
            "comming",
            "yes",
            "accepted",
            "going",
          ].includes(raw)
        )
          return "attending";
        if (
          ["notattending", "notcoming", "decline", "no", "sorry"].includes(raw)
        )
          return "not_attending";
        if (value === "Coming" || value === "Comming") return "attending";
        if (value === "Not Coming" || value === "NotComing")
          return "not_attending";
        return "";
      }

      function getStatusLabel(value) {
        const normalized = normalizeAttendance(value);
        if (normalized === "attending") return "Attending";
        if (normalized === "not_attending") return "Not attending";
        return "Pending";
      }

      function getStatusClass(value) {
        const normalized = normalizeAttendance(value);
        if (normalized === "attending") return "status-attending";
        if (normalized === "not_attending") return "status-not";
        return "status-pending";
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function renderTable() {
        const guests = guestData.invites || [];

        if (!guests.length) {
          guestTableBody.innerHTML =
            '<tr><td colspan="5" class="empty">No guests yet. Click “Add guest” to begin.</td></tr>';
          return;
        }

        guestTableBody.innerHTML = guests
          .map((guest, index) => {
            const attendanceValue = guest.attendance ?? guest.attending ?? "";
            const funcValue =
              guest.function || guest.eventType || guest.event || "Wedding Day";
            const status = normalizeAttendance(attendanceValue);
            return `
            <tr>
              <td>
                <input data-field="id" data-index="${index}" value="${escapeHtml(guest.id || "")}" aria-label="Guest ID" />
              </td>
              <td>
                <input data-field="name" data-index="${index}" value="${escapeHtml(guest.name || "")}" aria-label="Guest name" />
              </td>
              <td>
                <select data-field="attendance" data-index="${index}" aria-label="Attendance status">
                  <option value="" ${attendanceValue === "" ? "selected" : ""}>Pending</option>
                  <option value="Coming" ${attendanceValue === "Coming" || status === "attending" ? "selected" : ""}>Coming</option>
                  <option value="Not Coming" ${attendanceValue === "Not Coming" || status === "not_attending" ? "selected" : ""}>Not Coming</option>
                </select>
                <div class="status-pill ${getStatusClass(attendanceValue)}" style="margin-top:8px;">${getStatusLabel(attendanceValue)}</div>
              </td>
              <td>
                <input data-field="function" data-index="${index}" value="${escapeHtml(funcValue)}" aria-label="Event function" placeholder="Wedding Day" />
              </td>
              <td>
                <button class="button danger" type="button" data-delete-index="${index}">Delete</button>
              </td>
            </tr>
          `;
          })
          .join("");

        guestTableBody.querySelectorAll("input, select").forEach((input) => {
          input.addEventListener("input", (event) => {
            const index = Number(event.target.dataset.index);
            const field = event.target.dataset.field;
            const value = event.target.value.trim();

            if (field === "attendance") {
              guestData.invites[index].attendance = value || "Pending";
              guestData.invites[index].attending =
                value === "Coming"
                  ? "attending"
                  : value === "Not Coming"
                    ? "not_attending"
                    : "";
            } else if (field === "function") {
              guestData.invites[index].function = value || "Wedding Day";
              guestData.invites[index].eventType = value || "Wedding Day";
            } else {
              guestData.invites[index][field] = value;
            }

            renderTable();
          });
        });

        guestTableBody
          .querySelectorAll("[data-delete-index]")
          .forEach((button) => {
            button.addEventListener("click", (event) => {
              const index = Number(event.currentTarget.dataset.deleteIndex);
              guestData.invites.splice(index, 1);
              renderTable();
            });
          });
      }

      function downloadJson() {
        const payload = JSON.stringify(guestData, null, 2);
        const blob = new Blob([payload], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "db.json";
        link.click();
        URL.revokeObjectURL(url);
      }

      async function loadDbFromJson() {
        try {
          const response = await fetch("db.json", { cache: "no-store" });
          if (!response.ok) throw new Error("db.json not found");
          const data = await response.json();
          guestData = {
            event: data.event || defaultDb.event,
            invites: Array.isArray(data.invites) ? data.invites : [],
          };
          renderTable();
        } catch (error) {
          guestData = { ...defaultDb, invites: [...defaultDb.invites] };
          renderTable();
        }
      }

      document.getElementById("addBtn").addEventListener("click", () => {
        const nextId = `INV${String((guestData.invites || []).length + 1).padStart(3, "0")}`;
        guestData.invites.push({
          id: nextId,
          name: `Guest Name ${String((guestData.invites || []).length + 1).padStart(2, "0")}`,
          attendance: "",
          attending: null,
          function: "Wedding Day",
        });
        renderTable();
      });

      document
        .getElementById("downloadBtn")
        .addEventListener("click", downloadJson);
      document
        .getElementById("loadBtn")
        .addEventListener("click", loadDbFromJson);

      loadDbFromJson();
    </script>
  </body>
</html>
